name: Python CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: 필요한 도구 설치
        run: python -m pip install -r requirements-dev.txt

      - name: 코드 검사
        run: python -m ruff check .

      - name: 코드 모양 검사
        run: python -m ruff format --check .

      - name: 테스트와 커버리지 측정
        run: python -m pytest --cov=orderlab --cov-report=term-missing --cov-report=xml

      - name: 커버리지 보고서 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
